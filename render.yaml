services:
  - type: web
    name: mundotravel-api
    runtime: python
    rootDir: backend
    buildCommand: pip install .
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: +MundoTravel API
      - key: APP_ENV
        value: production
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: mundotravel-db
          property: connectionString
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
      - key: JWT_ALGORITHM
        value: HS256
      - key: FRONTEND_ORIGIN
        sync: false

databases:
  - name: mundotravel-db
    databaseName: mundotravel
    user: mundotravel
